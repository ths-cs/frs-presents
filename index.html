<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbowl Speech Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-dark: #1f2937;
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 550px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: var(--primary);
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1rem;
        }

        .input-group {
            margin: 1.5rem 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="number"] {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 70px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        #prompt-display {
            background: #f8fafc;
            border-left: 5px solid var(--primary);
            padding: 2rem;
            font-size: 1.4rem;
            margin: 1.5rem 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            border-radius: 8px;
            line-height: 1.5;
            color: #334155;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .secondary-btn {
            background: #0ea5e9;
            margin-top: 10px;
        }

        .secondary-btn:hover {
            background: #0284c7;
        }

        .poise-reminder {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f0f0;
        }

        .poise-reminder span {
            display: block;
            margin-top: 5px;
            font-weight: bold;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎤 Fishbowl Speech Generator</h1>
    
    <div class="input-group">
        <label for="box-num">Draw from Box (1-29):</label>
        <input type="number" id="box-num" min="1" max="29" placeholder="#">
        <button onclick="getBoxPrompt()">Draw</button>
    </div>

    <div id="prompt-display">Enter your box number to see your topic!</div>
    
    <button class="secondary-btn" onclick="generateRandomPrompt()">✨ Total Random Surprise</button>

    <div class="poise-reminder">
        <strong>Presentation Goals:</strong>
        <span>1. Agree or Disagree • 2. Provide 2-3 Examples • 3. Maintain Eye Contact</span>
    </div>
</div>

<script>
    // Data from Student Handout 2.8.1 and new expansion boxes
    const fishbowlData = {
        1: ["Money should be replaced with a barter system.", "Having siblings is a good thing.", "Monday should be the third day of a 3-day weekend."],
        2: ["Cool teachers are easier to learn from.", "The driving age should be 18.", "All high schools should have a school uniform."],
        3: ["Teens should get free therapy after a breakup.", "Zombies are real.", "Being lazy is a true art."],
        4: ["Having a Pen Pal is cool.", "Peer pressure can be a positive thing.", "Teens should spend more time in nature."],
        5: ["Students should be allowed to choose what they learn about in school.", "There is plenty of truth to horoscopes.", "FOMO is a real fear."],
        6: ["It is important to date someone with similar beliefs.", "Facebook is for old people.", "Celebrities have too much influence on teens."],
        7: ["It should be easier to get a driver's license.", "Junk food isn't all that bad.", "Homework does more harm than good."],
        8: ["It should be illegal for teens to drop out of school.", "Parents are embarrassing.", "Every teen should learn to cook."],
        9: ["'Staying in' is the new 'sneaking out.'", "Pets are far better to talk to than parents.", "Eating should always be allowed in classes."],
        10: ["Teens should be rewarded for doing the right thing.", "Teens need cell phones.", "Risk is a natural temptation for teens."],
        11: ["Teen suicide is not given enough attention.", "Teens should be banned from beauty surgery.", "More free time means more time to get into trouble."],
        12: ["Parents have no right to embarrass their teens.", "Teens should avoid dating too young.", "Driving tests should be free."],
        13: ["Teens do care what their parents think.", "Cyberbullies should be dealt with more severely.", "Teen boys and girls should be taught in separate classes."],
        14: ["It is important that teens become volunteers.", "Beauty contests are harmful.", "Middle school students should be banned from social media."],
        15: ["Tattoos should be illegal for teens.", "Teens that commit serious crimes should be charged as adults.", "Nice handwriting is a worthless skill."],
        16: ["Parents should never give teens too much money.", "Teens should spend more time with the elderly.", "Bullying changes a teen forever."],
        17: ["More time should be spent reading.", "Ads marketed to teens are too 'grown up'.", "Part-time jobs should be legal at 14."],
        18: ["Teens should not get involved in online relationships.", "Piercing your tongue is disgusting.", "More time should be spent in nature."],
        19: ["No teen should be labeled a lost cause.", "The media is responsible for society's moral decline.", "Boys get more acne than girls."],
        20: ["Respond to your enemies with kindness.", "There is no such thing as a bff.", "Community service is an effective consequence for teens in legal trouble."],
        21: ["Quiet time for teens is a necessity.", "Everyone should keep a journal.", "There is no getting out of the Friendship Zone."],
        22: ["It is possible to have too many friends.", "Funny guys get more dates than handsome guys.", "Wearing glasses makes you look smarter."],
        23: ["Parents have the right to always have access to their teen's phone.", "Teens should have their own savings account.", "Fame is bad for young people."],
        24: ["Parents have the right to set their teen's dress code.", "Face tats are always regretted at some point.", "Prom is overrated."],
        25: ["Schools should do more to prepare teens for puberty.", "Teens lead very stressful lives.", "Teens need adults to trust them."],
        26: ["Teens shouldn't be allowed to be millionaires.", "Teens often try too hard to copy others' looks.", "High schools shouldn't be allowed to start before 9am.", "Teens crave responsibility."],
        27: ["Summer break should be shorter but have more frequent breaks.", "Group projects are a fair way to grade students.", "Social media 'likes' should be hidden for everyone."],
        28: ["Standardized testing is an outdated way to measure intelligence.", "Every student should be required to learn a second language.", "Video games are more educational than movies."],
        29: ["Teens should have a say in their school’s budget.", "It is better to have one close friend than ten casual friends.", "AI will make school easier, not harder."]
    };

    function getBoxPrompt() {
        const boxNum = document.getElementById('box-num').value;
        const display = document.getElementById('prompt-display');
        
        if (fishbowlData[boxNum]) {
            const choices = fishbowlData[boxNum];
            const randomChoice = choices[Math.floor(Math.random() * choices.length)];
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = `Box ${boxNum}: "${randomChoice}"`;
                display.style.opacity = 1;
            }, 200);
        } else {
            alert("Please enter a box number between 1 and 29.");
        }
    }

    function generateRandomPrompt() {
        const allPrompts = Object.values(fishbowlData).flat();
        const randomPrompt = allPrompts[Math.floor(Math.random() * allPrompts.length)];
        const display = document.getElementById('prompt-display');
        
        display.style.opacity = 0;
        setTimeout(() => {
            display.innerText = `"${randomPrompt}"`;
            display.style.opacity = 1;
        }, 200);
    }
</script>

</body>
</html>
