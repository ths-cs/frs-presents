<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbowl Speech Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-dark: #1f2937;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: var(--primary);
            border-bottom: 2px solid #eee;
            padding-bottom: 1rem;
        }

        .input-group {
            margin: 1.5rem 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="number"] {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 80px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        #prompt-display {
            background: #f9fafb;
            border-left: 5px solid var(--primary);
            padding: 1.5rem;
            font-size: 1.3rem;
            margin: 2rem 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            border-radius: 8px;
            line-height: 1.4;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background: #10b981;
            margin-top: 10px;
        }

        .secondary-btn:hover {
            background: #059669;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 2rem 0;
        }

        .poise-reminder {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎤 Fishbowl Speech Generator</h1>
    
    <div class="input-group">
        <label for="box-num">Select Box (1-29):</label>
        <input type="number" id="box-num" min="1" max="29" placeholder="#">
        <button onclick="getBoxPrompt()">Draw from Box</button>
    </div>

    <div id="prompt-display">Draw a number or click surprise to begin!</div>
    
    <button class="secondary-btn" onclick="generateRandomPrompt()">✨ Surprise Me! (Total Random)</button>

    <div class="poise-reminder">
        <strong>Remember:</strong> Agree/Disagree • 2-3 Examples • Eye Contact 
    </div>
</div>
